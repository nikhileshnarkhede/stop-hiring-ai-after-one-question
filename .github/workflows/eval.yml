name: eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests for the scorer and the stats
        run: pytest -q
      - name: Eval gate (fails the build below the pass mark)
        run: python run_eval.py
